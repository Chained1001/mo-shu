name: Cross-platform smoke test
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run skill static check
        run: bash scripts/static-check.sh
      - name: Check story numbers
        run: bash scripts/check-story-numbers.sh
      - name: Story-number regression
        run: python3 scripts/test-story-numbers.py
      - name: Structured static-check regression
        run: python3 scripts/test-static-check.py
      - name: Check workflow numbering
        run: python3 scripts/skill-numbering.py check
      - name: Workflow numbering regression
        run: bash scripts/test-skill-numbering.sh
      - name: Check current-only skill contracts
        run: bash scripts/check-current-skill-contracts.sh
      - name: Current-only skill contract regression
        run: python3 scripts/test-current-skill-contracts.py
      - name: Check hot-path doc budget
        run: bash scripts/check-doc-budget.sh
      - name: Check hook-regex sync
        run: bash scripts/check-hook-regex-sync.sh
      - name: Check shared-file consistency
        run: bash scripts/check-shared-files.sh
      - name: Shared-asset manifest regression
        run: python3 scripts/test-shared-assets.py
      - name: Check behavior contracts
        run: bash scripts/check-behavior-contracts.sh
      - name: Behavior-contract regression
        run: python3 scripts/test-behavior-contracts.py
      - name: Check capability wiring
        run: bash scripts/check-capability-wiring.sh
      - name: Capability-wiring regression
        run: python3 scripts/test-capability-wiring.py
      - name: Check reference closure (asset universe)
        run: bash scripts/check-reference-closure.sh
      - name: Reference-closure regression
        run: python3 scripts/test-reference-closure.py
      - name: Check route-write residual guard
        run: bash scripts/check-route-write.sh
      - name: Route-write regression
        run: python3 scripts/test-route-write.py
      - name: Next-step routing regression
        run: python3 scripts/test-next-step.py
      - name: Check agents-version sync
        run: bash scripts/check-agents-version-sync.sh
      - name: Agents-version-sync regression
        run: python3 scripts/test-agents-version-sync.py
      - name: Check Claude Code adapter
        run: bash scripts/check-claude-adapter.sh
      - name: Check agent template rules
        run: bash scripts/check-agent-template-rules.sh
      - name: Agent-template-rules regression
        run: python3 scripts/test-agent-template-rules.py
      - name: Check eval scenarios (static, no LLM)
        run: bash scripts/check-eval-scenarios.sh
      - name: Guard against bare python3 invocations
        run: bash scripts/check-python-invocation.sh
      - name: Guard hook locale safety (LC_ALL=C + no full-width char classes)
        run: bash scripts/check-hook-locale-safety.sh
      - name: Syntax-check collection scripts
        run: |
          for f in $(find skills -name '*-scraper.js' -o -name 'cdp-utils.js' -o -name 'setup-cdp-chrome.js'); do
            echo "node --check $f"
            node --check "$f"
          done

  runtime-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Scan-analyze multi-platform regression
        run: node scripts/test-scan-analyze.js
      - name: Merge-chapter-summaries regression
        run: node scripts/test-merge-summaries.js
      - name: Chapter-boundary regression
        run: python3 scripts/test-chapter-boundary.py
      - name: Chapter-summary hard-check regression
        run: python3 scripts/test-chapter-summary.py
      - name: AI-pattern detector regression
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        run: bash scripts/test-outline-copy.sh
      - name: Degeneration detector regression
        run: bash scripts/test-degeneration.sh
      - name: Prose candidates regression
        run: node scripts/test-prose-candidates.js
      - name: Prose backstop hook regression
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Story continuity backstop regression
        run: bash scripts/test-story-continuity.sh
      - name: End-to-end prose quality eval (benchmark samples)
        run: bash scripts/eval-prose-quality.sh
      - name: Tracking workflow contract regression
        run: python3 scripts/test-tracking-workflow-contracts.py
      - name: Tracking transaction behavior regression
        run: python3 scripts/test-tracking-commit.py
      - name: Review tickets regression
        run: python3 scripts/test-review-tickets.py
      - name: Writing pipeline contract e2e
        run: bash scripts/test-writing-pipeline.sh
      - name: Impact-scan regression (build ring)
        run: python3 scripts/test-impact-scan.py
      - name: check_outline regression (build ring)
        run: python3 scripts/test-check-outline.py
      - name: bump-agents-version regression (scripts)
        run: python3 scripts/test-bump-agents-version.py
      # Generate a GBK-class locale so the hook test's Part 2 runs end-to-end here,
      # not just on macOS. Best-effort: if it fails the test self-skips Part 2.
      - name: Generate zh_CN.GBK locale (Chinese Windows simulation)
        run: sudo localedef -f GBK -i zh_CN zh_CN.GBK || sudo locale-gen zh_CN.GBK || true
      - name: Hook path-encoding portability (cp936 + real GBK locale)
        run: bash scripts/test-hook-encoding-portable.sh
      - name: Portable char-count (real interpreter)
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        run: bash scripts/test-charcount-portable.sh --stub

  deploy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check moshu-setup deployment
        run: bash scripts/check-moshu-setup-deployment.sh
      - name: Deploy.py behavior regression
        run: python3 scripts/test-deploy.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: AI-pattern detector regression
        shell: bash
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        shell: bash
        run: bash scripts/test-outline-copy.sh
      - name: Degeneration detector regression
        shell: bash
        run: bash scripts/test-degeneration.sh
      - name: Prose backstop hook regression
        shell: bash
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Story continuity backstop regression
        shell: bash
        run: bash scripts/test-story-continuity.sh
      - name: Tracking workflow contract regression
        run: python scripts/test-tracking-workflow-contracts.py
      - name: Tracking transaction behavior regression
        run: python scripts/test-tracking-commit.py
      - name: Workflow numbering regression
        shell: bash
        run: bash scripts/test-skill-numbering.sh
      - name: Check shared-file consistency (Windows Git Bash)
        shell: bash
        run: bash scripts/check-shared-files.sh
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify cdp-utils loads
        run: node -e "const u = require('./skills/moshu-scan/scripts/cdp-utils.js'); console.log('exports:', Object.keys(u));"
      - name: Verify sleep works
        run: node -e "const { sleep } = require('./skills/moshu-scan/scripts/cdp-utils.js'); const t0 = Date.now(); sleep(100); console.log('slept', Date.now()-t0, 'ms');"
      - name: Verify setup script dry-run
        run: node skills/moshu-cdp/scripts/setup-cdp-chrome.js 9222 --dry-run
      # Run under Git Bash (shell: bash on windows-latest), matching how Claude Code
      # executes its Bash tool on Windows — this is where the python3 exit-49 bug bites.
      - name: Portable char-count (real interpreter)
        shell: bash
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        shell: bash
        run: bash scripts/test-charcount-portable.sh --stub
      # Real Windows Git Bash path: the cp936 stdout bug (issue #164) bites here.
      - name: Hook path-encoding portability (cp936 + GBK locale if present)
        shell: bash
        run: bash scripts/test-hook-encoding-portable.sh

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: AI-pattern detector regression
        run: bash scripts/test-ai-patterns.sh
      - name: Outline-copy detector regression
        run: bash scripts/test-outline-copy.sh
      - name: Degeneration detector regression
        run: bash scripts/test-degeneration.sh
      - name: Prose backstop hook regression
        run: bash scripts/test-prose-backstop-hook.sh
      - name: Story continuity backstop regression
        run: bash scripts/test-story-continuity.sh
      - name: Tracking workflow contract regression
        run: python3 scripts/test-tracking-workflow-contracts.py
      - name: Tracking transaction behavior regression
        run: python3 scripts/test-tracking-commit.py
      - name: Workflow numbering regression
        run: bash scripts/test-skill-numbering.sh
      - name: Punctuation normalizer regression
        run: node scripts/test-normalize-punctuation.js
      - name: Scan runtime regression
        run: node scripts/test-scan-runtime.js
      - name: Check shared-file consistency (macOS Bash 3)
        run: bash scripts/check-shared-files.sh
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Verify cdp-utils loads
        run: node -e "const u = require('./skills/moshu-scan/scripts/cdp-utils.js'); console.log('exports:', Object.keys(u));"
      - name: Verify sleep works
        run: node -e "const { sleep } = require('./skills/moshu-scan/scripts/cdp-utils.js'); const t0 = Date.now(); sleep(100); console.log('slept', Date.now()-t0, 'ms');"
      - name: Verify setup script dry-run
        run: node skills/moshu-cdp/scripts/setup-cdp-chrome.js 9222 --dry-run
      - name: Portable char-count (real interpreter)
        run: bash scripts/test-charcount-portable.sh
      - name: Portable char-count (simulated Windows Store stub)
        run: bash scripts/test-charcount-portable.sh --stub
      - name: Hook path-encoding portability (cp936 + GBK locale if present)
        run: bash scripts/test-hook-encoding-portable.sh
